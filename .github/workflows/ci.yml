name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest line that runs the TypeScript tests directly; 26 is the newest.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run lint

      # Node 22.18+ strips TypeScript natively, so the suite runs the real modules
      # with no build step and no test-only transform in between.
      - name: Provenance verification tests
        run: npm test

      - name: Corpus provenance is consistent across app and CLI
        run: npm run check:corpus

      - name: Production build
        run: npm run build

      - name: Server boots and serves the built app
        run: |
          NODE_ENV=production PORT=3100 node dist/server.cjs &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:3100/ && break
            sleep 1
          done
          curl -sf -o /dev/null -w 'root %{http_code}\n' http://localhost:3100/
          curl -sf -o /dev/null -w 'spa fallback %{http_code}\n' http://localhost:3100/deep/route

      - name: No API key committed
        run: |
          if git grep -InE 'AIza[0-9A-Za-z_-]{20,}' -- . ':!package-lock.json'; then
            echo "::error::A Google API key appears to be committed."
            exit 1
          fi
          echo "No API key found in tracked files."
